<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <title>فيجن ميديكال للأجهزة الطبية | Vision Medical</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="shortcut icon" href="favicon.ico">

  <!-- Google Fonts: Tajawal & Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">

  <!-- FontAwesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased bg-slate-950">
  <app-root>
    <!-- Instant Loading Screen before Angular JS hydrates -->
    <div style="position: fixed; inset: 0; background-color: #020617; z-index: 999999; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Tajawal', sans-serif;">
      <div style="position: relative; display: flex; align-items: center; justify-content: center;">
        <div style="width: 80px; height: 80px; border-radius: 50%; border: 4px solid rgba(16, 185, 129, 0.15); border-top-color: #10b981; animation: vmSpin 0.9s linear infinite;"></div>
        <img src="/images/logo.png" alt="Vision Medical" style="height: 40px; width: 40px; position: absolute; top: 20px; left: 20px; object-fit: contain;">
      </div>
      <div style="text-align: center; margin-top: 20px;">
        <div style="font-size: 18px; font-weight: 900; color: #00A99D; letter-spacing: 0.02em;">فيجن ميدكال</div>
        <div style="font-size: 12px; color: #94a3b8; margin-top: 4px; font-weight: 500;">جاري تحميل النظام...</div>
      </div>
    </div>
    <style>
      @keyframes vmSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
  </app-root>
</body>
</html>
